body {

.shake-animation { animation: dmgShake 0.45s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes dmgShake {
 10%, 90% { transform: translate3d(-4px, 0, 0); } 20%, 80% { transform: translate3d(6px, 0, 0); }
 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); }
}
.rising-item { position: fixed; bottom: -30px; z-index: 9999; pointer-events: none; user-select: none; opacity: 0; animation: riseMagic ease-out forwards; }
@keyframes riseMagic {
 0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; } 15% { opacity: 0.95; }
 50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.9; }
 85% { opacity: 0.7; } 100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }

.tab-sub { display: block; }

 }

<script>
function showModal(message, opts) {
  opts = opts || {};
  const overlay = document.getElementById("confirm-overlay");
  document.getElementById("confirm-message").textContent = message;
  const okBtn = document.getElementById("confirm-ok-btn");
  const cancelBtn = document.getElementById("confirm-cancel-btn");
  cancelBtn.style.display = opts.showCancel ? "inline-block" : "none";
  overlay.style.display = "flex";
  const cleanup = () => { overlay.style.display = "none"; okBtn.onclick = null; cancelBtn.onclick = null; };
  okBtn.onclick = () => { cleanup(); if (opts.onOk) opts.onOk(); };
  cancelBtn.onclick = () => { cleanup(); if (opts.onCancel) opts.onCancel(); };
}
function customConfirm(message, onConfirm) { showModal(message, { showCancel: true, onOk: onConfirm }); }
function customAlert(message) { showModal(message, { showCancel: false, onOk: null }); }
</script>
<script>
const RISING_EFFECT_SYMBOLS = ["💰", "🪙", "✨", "📜", "⭐", "🍺", "🧪"];

const STAGES = [
 { title: "Stage 1：路地裏の屋台開業 〜元手と拠点の確保〜", questions: [

}

// ---- 貼り付けた文字の解析 ----
function lineOf(text, pos) { return text.slice(0, pos).split("\n").length; }

function findClose(s, start) {
 let depth = 0, inStr = false;
 for (let i = start; i < s.length; i++) {
 const c = s[i];
 if (inStr) { if (c === "\\") i++; else if (c === '"') inStr = false; continue; }
 if (c === '"') inStr = true;
 else if (c === "{" || c === "[") depth++;
 else if (c === "}" || c === "]") { depth--; if (depth === 0) return i; }
 }
 return -1;
}

function stripTrailingCommas(t) {
 let out = "", inStr = false;
 for (let i = 0; i < t.length; i++) {
 const c = t[i];
 if (inStr) { out += c; if (c === "\\") { out += t[++i] || ""; } else if (c === '"') inStr = false; continue; }
 if (c === '"') { inStr = true; out += c; continue; }
 if (c === ",") {
 let j = i + 1;
 while (j < t.length && /\s/.test(t[j])) j++;
 if (t[j] === "}" || t[j] === "]") continue;
 }
 out += c;
 }
 return out;
}

function parseJsonBlocks(raw) {
 const s = raw.replace(/[​﻿]/g, "").replace(/```[a-zA-Z0-9]*/g, "").replace(/^\s*\/\/.*$/gm, "");
 const blocks = [];
 let i = 0;
 while (i < s.length) {
 const c = s[i];
 if (c === "{" || c === "[") {
 const end = findClose(s, i);
 if (end < 0) throw new Error(`${lineOf(s, i)}行目の ${c} に対応する閉じ括弧がありません。貼り付けた内容が途中で切れていないか確認してください。`);
 const text = s.slice(i, end + 1);
 try {
 blocks.push(JSON.parse(stripTrailingCommas(text)));
 } catch (e) {
 const pm = /position (\d+)/.exec(e.message || "");
 const where = pm ? `（${lineOf(s, i) + lineOf(text, parseInt(pm[1], 10)) - 1}行目付近）` : "";
 throw new Error(`JSONの書き方に誤りがあります${where}。引用符が “ ” になっていないか、カンマや括弧が抜けていないか確認してください。`);
 }
 i = end + 1;
 } else i++;
 }
 return blocks;
}

function checkQuestions(qs, label, warnings) {
 for (let i = 0; i < qs.length; i++) {
 const q = qs[i];
 const at = `${label}${i + 1}問目`;
 if (!q || typeof q !== "object") return `${at}：問題の形が正しくありません。`;
 if (typeof q.story !== "string" || !q.story.trim()) return `${at}：story（物語文）がありません。`;
 for (const side of ["debit", "credit"]) {
 let arr = q[side];
 if (arr && !Array.isArray(arr) && typeof arr === "object") arr = [arr];
 if (!Array.isArray(arr) || arr.length === 0) return `${at}：${side} がありません。`;
 for (const e of arr) {
 if (!e || typeof e.account !== "string" || !e.account.trim()) return `${at}：${side} の account（勘定科目名）がありません。`;
 const n = typeof e.amount === "string" ? Number(e.amount.replace(/,/g, "")) : e.amount;
 if (!Number.isInteger(n) || n < 1) return `${at}：${side} の amount は1以上の整数にしてください。`;
 e.amount = n;
 }
 q[side] = arr;
 }
 if (typeof q.explanation !== "string") q.explanation = q.explanation == null ? "" : String(q.explanation);
 const sum = a => a.reduce((t, e) => t + e.amount, 0);
 if (sum(q.debit) !== sum(q.credit)) warnings.push(at);
 }
 return null;
}

 for (let i = 0; i < n; i++) {
 const st = stages[i];
 if (typeof st.title === "string" && st.title.trim()) { STAGES[i].title = st.title.trim(); customTitleIdx.add(i); }
 STAGES[i].questions = st.questions;
 prev[i] = { title: STAGES[i].title, questions: st.questions };
 lsRemove(`isekai_stall_boki_st${i}_data`);
 total += st.questions.length;
 }
 lsSet(KEY_STAGES, JSON.stringify(prev));
 updateTabLabels();
 loadStage(0);
 done.push(`${n}ステージ（${total}問）を取り込みました`);
 if (stages.length > STAGES.length) notes.push(`${STAGES.length + 1}ステージ目以降は、このアプリでは使えないため取り込んでいません。`);
 }
 if (single) {
 STAGES[currentStageIndex].questions = single;
 lsSet(`isekai_stall_boki_st${currentStageIndex}_data`, JSON.stringify(single));
 loadStage(currentStageIndex);
 done.push(`STAGE ${currentStageIndex + 1} の商談記録を更新しました（全${single.length}件）`);
 }
 if (warnings.length) notes.push(`貸借の合計が合っていない問題があります：${warnings.slice(0, 5).join("、")}${warnings.length > 5 ? " ほか" : ""}。AIに作り直してもらうことをおすすめします。`);
 if (!storageOk()) notes.push("⚠️ このブラウザ（または表示方法）では、取り込んだ内容を端末に保存できませんでした。開いている間は使えますが、ブラウザやアプリを閉じると元に戻ります。閉じたあとは、同じJSONをもう一度貼り付けてください。");
 document.getElementById("json-input").value = "";
 customAlert(done.join("。") + "。" + (notes.length ? "\n\n" + notes.join("\n") : ""));
}

window.addEventListener("DOMContentLoaded", init);
window.addEventListener("keydown", (e) => {
  const activeEl = document.activeElement;
  const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA");
  const quizArea = document.getElementById("quiz-area");
  if (!quizArea || quizArea.style.display === "none") return;
  if (e.key === "ArrowRight") { if (!isTyping || e.altKey || e.ctrlKey) { e.preventDefault(); nextQuestion(); } }
  else if (e.key === "ArrowLeft") { if (!isTyping || e.altKey || e.ctrlKey) { e.preventDefault(); prevQuestion(); } }
});
</script>
